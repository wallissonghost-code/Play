<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>NOT DUEL</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="app">
  <header class="brand"><strong>NOT</strong><span>DUEL</span><div id="liveBadge">● LIVE</div></header>

  <section class="players">
    <article class="player host"><div class="avatar" id="hostAvatar">H</div><div><small>HOST</small><strong id="hostName">@host</strong></div><b class="mark">X</b></article>
    <div class="versus">VS</div>
    <article class="player challenger"><div class="avatar" id="challengerAvatar">?</div><div><small>DESAFIANTE</small><strong id="challengerName">Aguardando...</strong></div><b class="mark">O</b></article>
  </section>

  <section class="game-wrap">
    <div class="status" id="status">AGUARDANDO DESAFIANTE</div>
    <div class="board" id="board" aria-label="Jogo da velha"></div>
  </section>

  <section class="mission" id="mission">
    <div class="mission-glow"></div>
    <small>DESAFIE O HOST</small>
    <strong>🌹 ENVIE <span id="roseGoal">5</span> ROSAS</strong>
    <p>Complete o desafio para entrar na partida</p>
    <div class="progress"><i id="progressBar"></i></div>
    <span id="progressText">0 / 5</span>
  </section>

  <footer><span id="hint">Casas livres: comente um número de 1 a 9</span><b>NOT</b></footer>
</main>
<script src="app.js"></script>
</body>
</html>
